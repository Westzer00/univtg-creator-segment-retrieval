name: CSV validation tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pandas
      - name: Check CSV validation
        run: python -m pytest -q tests/
      - name: Run synthetic CSV example
        run: python -m examples.run_csv_demo
